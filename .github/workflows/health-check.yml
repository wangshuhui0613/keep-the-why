name: vault health check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run vault health check
        run: python3 tools/vault_health_check.py --root .

      - name: Verify demo pages are in sync with the build prompt
        run: |
          python3 tools/build_demo.py
          git diff --exit-code docs/demo.html docs/demo-cdn.html
